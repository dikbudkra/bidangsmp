name: Build APK Android Otomatis

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Rakit APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode Repository
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Membangun Proyek Android & Rakit APK
        run: |
          # 1. Buat folder 'www' dan salin file web agar Capacitor tidak error "subdirectory of itself"
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/ 2>/dev/null || true

          # 2. Inisialisasi proyek mobile Android
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Bidang SMP" "id.go.karanganyar.disdikbud.smp" --web-dir=www
          
          # 3. Mengatur agar APK langsung membuka web GitHub Pages Anda (Standalone PWA/TWA mode)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "id.go.karanganyar.disdikbud.smp",
            "appName": "Bidang SMP",
            "webDir": "www",
            "server": {
              "url": "https://dikbudkra.github.io/bidangsmp",
              "cleartext": true
            }
          }
          EOF

          # 4. Menambahkan platform Android dan memulai proses Build APK
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. Upload Hasil APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bidang-SMP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
