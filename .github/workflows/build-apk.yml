name: Build APK Android Otomatis

on:
  workflow_dispatch: # Memunculkan tombol manual "Run workflow" di tab Actions
  push:
    branches: [ main, master ] # Otomatis jalan setiap ada update kode

jobs:
  build-apk:
    name: Rakit APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode Repository
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Membangun Proyek Android & Rakit APK
        run: |
          # Inisialisasi proyek mobile Android
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "Bidang SMP" "id.go.karanganyar.disdikbud.smp" --web-dir=.
          
          # Mengatur agar APK langsung membuka web GitHub Pages Anda (Standalone PWA/TWA mode)
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "id.go.karanganyar.disdikbud.smp",
            "appName": "Bidang SMP",
            "webDir": ".",
            "server": {
              "url": "https://dikbudkra.github.io/bidangsmp",
              "cleartext": true
            }
          }
          EOF

          # Menambahkan platform Android dan memulai proses Build APK
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. Upload Hasil APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bidang-SMP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
