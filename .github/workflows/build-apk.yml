name: Build APK Android Otomatis

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Rakit APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Mengambil Kode Repository
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Menyiapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Membangun Proyek Android & Rakit APK (Anti-Error)
        run: |
          # 1. Siapkan folder 'www' dan salin file web PWA
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/ 2>/dev/null || true

          # 2. Inisialisasi proyek mobile Android
          npm init -y
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest
          npx cap init "Bidang SMP" "id.go.karanganyar.disdikbud.smp" --web-dir=www
          
          # 3. Konfigurasi Standalone TWA / WebView mengarah ke GitHub Pages
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "id.go.karanganyar.disdikbud.smp",
            "appName": "Bidang SMP",
            "webDir": "www",
            "server": {
              "url": "https://dikbudkra.github.io/bidangsmp",
              "cleartext": true
            }
          }
          EOF

          # 4. Tambahkan platform Android
          npx cap add android

          mkdir -p assets
          cp icon-512.png assets/icon.png 2>/dev/null || true
          npm install -D @capacitor/assets@latest
          npx capacitor-assets generate --android

          # === SOLUSI TUNTAS MENGHILANGKAN SUDUT PUTIH (DARK NAVY #0f172a) ===
          # 1. Hapus gambar background putih hasil generate otomatis
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_background.* 2>/dev/null || true
          rm -f android/app/src/main/res/drawable-*/ic_launcher_background.* 2>/dev/null || true

          # 2. Paksa konfigurasi Adaptive Icon Android memakai warna XML (bukan gambar)
          sed -i 's/@mipmap\/ic_launcher_background/@color\/ic_launcher_background/g; s/@drawable\/ic_launcher_background/@color\/ic_launcher_background/g' android/app/src/main/res/mipmap-anydpi-v26/*.xml 2>/dev/null || true

          # 3. Tetapkan warna Dark Navy (#0f172a) ke seluruh file konfigurasi
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0f172a</color>
          </resources>
          EOF
          find android/app/src/main/res -type f -name "*.xml" -exec sed -i 's/#FFFFFF/#0f172a/g; s/#ffffff/#0f172a/g; s/#FFF/#0f172a/g; s/#fff/#0f172a/g' {} +
          # ===================================================================

          # 5. SOLUSI MASALAH 1 & 2: Mencegah Bentrok Kotlin & Optimasi Memori Gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          cat << 'EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 6. Eksekusi perakitan APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. Upload Hasil APK ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Bidang-SMP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
