<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Aplikasi SMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Agar transisi mulus dan tampilan bersih */
    .hidden-section { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- ================= 1. HALAMAN LOGIN ================= -->
  <section id="login-section" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md">
      <div class="text-center mb-6">
        <i class="fa-solid fa-school text-blue-500 text-4xl mb-3"></i>
        <h1 class="text-2xl font-bold">Portal Aplikasi SMP</h1>
        <p class="text-slate-400 text-sm">Masuk sekali untuk akses seluruh layanan</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input type="text" id="username" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-slate-100">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" id="password" required class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-slate-100">
        </div>
        <div id="login-error" class="text-red-400 text-sm hidden-section text-center"></div>
        <button type="submit" id="btn-login" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 font-medium rounded-lg transition">
          Masuk ke Portal
        </button>
      </form>
    </div>
  </section>

  <!-- ================= 2. DASHBOARD GRID ================= -->
  <section id="dashboard-section" class="hidden-section p-6 max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800/80 p-4 rounded-xl border border-slate-700">
      <div class="flex items-center space-x-3 mb-4 md:mb-0">
        <i class="fa-solid fa-layer-group text-blue-500 text-2xl"></i>
        <div>
          <h1 class="text-xl font-bold">Dashboard Layanan SMP</h1>
          <p id="user-greeting" class="text-xs text-slate-400">Selamat datang</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button id="btn-add-modal" class="hidden-section px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-medium rounded-lg transition">
          <i class="fa-solid fa-plus mr-1"></i> Tambah Aplikasi
        </button>
        <button id="btn-logout" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-sm font-medium rounded-lg transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <div class="mb-6">
      <div class="relative max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-500"></i>
        <input type="text" id="search-input" placeholder="Cari aplikasi (misal: SPMB, Revit, DU)..." class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-100">
      </div>
    </div>

    <!-- Grid Aplikasi -->
    <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Kartu aplikasi akan muncul di sini secara otomatis dari JavaScript -->
    </div>
  </section>

  <!-- ================= 3. IFRAME VIEWER ================= -->
  <section id="viewer-section" class="hidden-section fixed inset-0 bg-slate-950 flex flex-col z-50">
    <!-- Top Bar Viewer -->
    <div class="bg-slate-800 px-4 py-3 flex justify-between items-center border-b border-slate-700">
      <div class="flex items-center space-x-3">
        <button id="btn-close-viewer" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm transition">
          <i class="fa-solid fa-arrow-left mr-1"></i> Kembali
        </button>
        <span id="viewer-title" class="font-semibold text-slate-200">Nama Aplikasi</span>
      </div>
      <div class="text-xs text-slate-400 hidden sm:block">
        <i class="fa-solid fa-lock mr-1 text-emerald-400"></i> Sesi Aman Portal
      </div>
    </div>
    <!-- Iframe Container -->
    <div class="flex-1 w-full bg-white">
      <iframe id="app-frame" src="" class="w-full h-full border-0" allow="fullscreen"></iframe>
    </div>
  </section>

  <!-- ================= 4. MODAL TAMBAH APP (SUPERADMIN) ================= -->
  <div id="modal-add" class="hidden-section fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
      <h3 class="text-lg font-bold mb-4">Tambah Aplikasi Baru</h3>
      <form id="form-add-app" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Nama Aplikasi</label>
          <input type="text" id="add-name" required placeholder="misal: Laporan SPMB" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Kategori</label>
          <input type="text" id="add-category" required placeholder="misal: Akademik" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">URL GAS Web App</label>
          <input type="url" id="add-url" required placeholder="https://script.google.com/..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="btn-close-modal" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">Batal</button>
          <button type="submit" id="btn-save-app" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // URL Web App GAS Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbyOQdBs2fB3L1mJfKLZCfbrlGwIhjHDMiOA5IwlpKoirbhExnS0b16pez7iYKKKnJrO/exec";

    let currentUser = null;
    let appsData = [];

    // --- SECTION CONTROLLER ---
    function showSection(sectionId) {
      document.getElementById('login-section').classList.add('hidden-section');
      document.getElementById('dashboard-section').classList.add('hidden-section');
      document.getElementById('viewer-section').classList.add('hidden-section');
      document.getElementById(sectionId).classList.remove('hidden-section');
    }

    // --- PROSES LOGIN ---
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errBox = document.getElementById('login-error');
      
      btn.innerText = "Memeriksa...";
      errBox.classList.add('hidden-section');

      const payload = {
        action: "login",
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const res = await response.json();

        if (res.success) {
          currentUser = res.user;
          document.getElementById('user-greeting').innerText = `Halo, ${currentUser.name} (${currentUser.role})`;
          
          if (currentUser.role === "SuperAdmin") {
            document.getElementById('btn-add-modal').classList.remove('hidden-section');
          }
          
          showSection('dashboard-section');
          loadApps();
        } else {
          errBox.innerText = res.message;
          errBox.classList.remove('hidden-section');
        }
      } catch (err) {
        errBox.innerText = "Gagal terhubung ke server.";
        errBox.classList.remove('hidden-section');
      } finally {
        btn.innerText = "Masuk ke Portal";
      }
    });

    // --- MENGAMBIL DATA APLIKASI ---
    async function loadApps() {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">Memuat aplikasi...</div>`;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getApps" })
        });
        const res = await response.json();
        if (res.success) {
          appsData = res.data;
          renderApps(appsData);
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-red-400">Gagal memuat daftar aplikasi.</div>`;
      }
    }

    // --- MENAMPILKAN KARTU APLIKASI ---
    function renderApps(list) {
      const grid = document.getElementById('apps-grid');
      grid.innerHTML = "";

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">Belum ada aplikasi yang ditampilkan.</div>`;
        return;
      }

      list.forEach(app => {
        const isSuperAdmin = currentUser && currentUser.role === "SuperAdmin";
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700 hover:border-blue-500/50 rounded-xl p-4 flex flex-col justify-between transition group shadow-lg";
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="text-[11px] font-semibold tracking-wider uppercase px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded border border-blue-500/20">${app.category}</span>
              ${isSuperAdmin ? `
                <button onclick="deleteApp('${app.id}')" title="Hapus" class="text-slate-500 hover:text-rose-400 text-xs transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              ` : ''}
            </div>
            <h3 class="font-bold text-base group-hover:text-blue-400 transition mb-1">${app.name}</h3>
          </div>
          <button onclick="openApp('${app.name}', '${app.url}')" class="mt-4 w-full py-2 bg-slate-700 group-hover:bg-blue-600 rounded-lg text-sm font-medium transition flex items-center justify-center">
            <span>Buka Aplikasi</span>
            <i class="fa-solid fa-arrow-right-long ml-2 text-xs"></i>
          </button>
        `;
        grid.appendChild(card);
      });
    }

    // --- BUKA IFRAME (TANPA TAB BARU & BANNER MINIMAL) ---
    function openApp(title, url) {
      document.getElementById('viewer-title').innerText = title;
      document.getElementById('app-frame').src = url;
      showSection('viewer-section');
    }

    document.getElementById('btn-close-viewer').addEventListener('click', function() {
      document.getElementById('app-frame').src = ""; // Reset frame
      showSection('dashboard-section');
    });

    // --- PENCARIAN (SEARCH BAR) ---
    document.getElementById('search-input').addEventListener('input', function(e) {
      const keyword = e.target.value.toLowerCase();
      const filtered = appsData.filter(app => 
        app.name.toLowerCase().includes(keyword) || 
        app.category.toLowerCase().includes(keyword)
      );
      renderApps(filtered);
    });

    // --- TAMBAH APLIKASI (SUPERADMIN) ---
    document.getElementById('btn-add-modal').addEventListener('click', () => {
      document.getElementById('modal-add').classList.remove('hidden-section');
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('modal-add').classList.add('hidden-section');
    });

    document.getElementById('form-add-app').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-save-app');
      btn.innerText = "Menyimpan...";

      const payload = {
        action: "addApp",
        data: {
          name: document.getElementById('add-name').value,
          category: document.getElementById('add-category').value,
          url: document.getElementById('add-url').value
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (res.success) {
          document.getElementById('modal-add').classList.add('hidden-section');
          document.getElementById('form-add-app').reset();
          loadApps(); // Muat ulang data terbaru dari sheet
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal menambahkan aplikasi.");
      } finally {
        btn.innerText = "Simpan";
      }
    });

    // --- HAPUS APLIKASI (SUPERADMIN) ---
    async function deleteApp(id) {
      if (!confirm("Yakin ingin menghapus aplikasi ini dari portal?")) return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "deleteApp", id: id })
        }).then(r => r.json());

        if (res.success) {
          loadApps();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal menghapus aplikasi.");
      }
    }

    // --- LOGOUT ---
    document.getElementById('btn-logout').addEventListener('click', function() {
      currentUser = null;
      document.getElementById('username').value = "";
      document.getElementById('password').value = "";
      showSection('login-section');
    });
  </script>
</body>
</html>
